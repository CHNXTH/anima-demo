<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anima · FY 交互 Demo</title>
<style>
@font-face{font-family:Firefont;src:url('assets/Firefont-Regular.woff') format('woff');font-weight:100 900;font-display:block}
:root{color-scheme:light;font-family:Firefont,sans-serif;color:#17224b;background:#ffffff}*{box-sizing:border-box}body{margin:0}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid #8b78d5;outline-offset:4px}header{max-width:1440px;margin:auto;padding:22px 28px 16px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:20px;display:flex;gap:14px;align-items:baseline}.brand small{font-size:13px;color:#747b92}.tools{display:flex;flex-wrap:wrap;gap:6px}.tools button{background:transparent;border:1px solid #cbcbd2;border-radius:24px;padding:8px 15px;font-size:13px}.tools button[aria-pressed=true]{background:#17224b;color:#fff;border-color:#17224b}.tools .primary{background:#cfc7ff;border-color:#cfc7ff}.viewport{width:calc(100% - 56px);max-width:1440px;aspect-ratio:16/10;margin:auto;position:relative;overflow:hidden;background:#eee;border-radius:20px}.stage{width:2560px;height:1600px;position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;user-select:none;touch-action:none;background:#eee}.reference{position:absolute;inset:0;width:2560px;height:1600px;pointer-events:none}.ambi{position:absolute;left:1180px;top:-260px;width:1600px;height:1600px;border-radius:50%;background:#cfc7ff;overflow:hidden;pointer-events:none}.ambi img{display:block;width:1600px;height:1600px}.pet{position:absolute;left:1607px;top:206px;width:745px;height:1012px;z-index:3;cursor:grab;touch-action:none;transform-origin:center bottom;will-change:transform}.pet:active{cursor:grabbing}.pet img{width:100%;height:100%;object-fit:contain;pointer-events:none;display:block;filter:drop-shadow(0 3px 2px #00000003)}.pet.idle{animation:breathe 5s ease-in-out infinite}.pet.reacting{animation:respond .5s ease-in-out}.pet.dragging{animation:none;filter:drop-shadow(0 12px 16px #17224b18)}.pet.floating{width:420px;height:440px}.hotspot{position:absolute;border:0;border-radius:150px;background:transparent;z-index:5;padding:0}.hotspot:hover{background:#a894ff0b}.hotspot:active{background:#a894ff1c}.hotspot svg{width:76px;height:76px;fill:#17224b}.play{left:385px;top:930px;width:170px;height:215px}.next{left:570px;top:930px;width:160px;height:215px}.source{left:190px;top:930px;width:170px;height:215px}.star{left:808px;top:900px;width:300px;height:295px}.switch{left:2275px;top:1190px;width:160px;height:160px;background:transparent;display:block}.switch img{display:block;width:160px;height:160px;pointer-events:none}.top-status{position:absolute;left:1875px;top:0;width:685px;height:125px;pointer-events:none;z-index:4}.map{left:1155px;top:1425px;width:180px;height:125px}.home{left:955px;top:1425px;width:175px;height:125px}.stop-nav{left:808px;top:900px;width:300px;height:295px}.play.is-playing{background:#cfc7ff}.play.is-playing:hover{background:#c6bdff}.play.is-playing:before,.play.is-playing:after{content:'';position:absolute;top:75px;width:15px;height:62px;border-radius:5px;background:#17224b}.play.is-playing:before{left:63px}.play.is-playing:after{left:93px}.hint-glow{box-shadow:inset 0 0 0 3px #9781e6!important;background:#cfc7ff30!important}.pet.hint-glow{border-radius:200px}.laser{position:absolute;width:22px;height:22px;border-radius:50%;background:#e9ff64;box-shadow:0 0 26px #d5f840;pointer-events:none;z-index:4;display:none}.message{position:absolute;left:1680px;top:140px;max-width:700px;padding:22px 36px;border-radius:40px;background:#f2effc;color:#17224b;font-size:34px;z-index:6;pointer-events:none;opacity:0;transition:opacity .18s}.message.show{opacity:1}.stage.clock .ambi,.stage.clock .pet,.stage.clock .switch{display:none}.stage.map-view .ambi,.stage.map-view .pet,.stage.map-view .effects,.stage.clock .effects{display:none}.stage.map-view .switch{display:flex}.stage:not(.navigating) .stop-nav{display:none}.stage.navigating .source,.stage.navigating .play,.stage.navigating .next,.stage.navigating .star{display:none}.stage.floating .ambi{display:none}.stage.floating .switch{display:none}.stage.floating:not(.navigating) .reference{content:url('assets/launcher-clean.png')}.stage.navigating .pet{cursor:default}.stage[data-gear=D] .pet{cursor:default}.stage[data-gear=D] .pet.idle{animation-duration:7s}.viewport:fullscreen{width:100vw;max-width:none;height:100vh;aspect-ratio:auto;background:#eee;border-radius:0}.footer{max-width:1440px;padding:16px 28px 28px;margin:auto;font-size:13px;color:#68718b}.statusline{display:none;justify-content:space-between;gap:20px;margin-bottom:14px;line-height:1.8}.statusline strong{font-weight:400;color:#17224b}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.actions button{border:0;border-radius:24px;background:#eee9ff;border:1px solid #d3c7f2;color:#354169;padding:9px 17px;font-size:13px;box-shadow:0 1px 2px #17224b08}.actions button:hover{background:#dcd5ff}.actions button:disabled{opacity:.4;cursor:default}.note{color:#81869a;font-size:12px;line-height:1.8;margin:0}.note a{color:inherit}details{margin-top:12px;font-size:12px;line-height:1.8}summary{cursor:pointer}details p{max-width:1000px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.003)}}@keyframes respond{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}@media(prefers-reduced-motion:reduce){.pet.idle,.pet.reacting{animation:none}}@media(max-width:720px){header{align-items:flex-start;flex-direction:column;padding:16px}.brand small{font-size:11px}.viewport{width:calc(100% - 24px);border-radius:12px}.footer{padding:14px 16px}.statusline{flex-direction:column;gap:4px}}

.effects{position:absolute;inset:0;z-index:2;pointer-events:none;clip-path:circle(800px at 1980px 540px)}.effects img{position:absolute;display:none;opacity:0;object-fit:contain;will-change:transform,opacity}.effects .fx-star{left:1450px;top:700px;width:230px;height:230px}.effects .fx-loop{left:2150px;top:210px;width:400px;height:340px}.effects .fx-startle{left:2135px;top:205px;width:370px;height:390px}.effects[data-kind=touch] .fx-star,.effects[data-kind=touch] .fx-loop{display:block}.effects[data-kind=startle] .fx-startle{display:block}.effects.run .fx-star{animation:floatStar 1900ms cubic-bezier(.18,.72,.3,1) both}.effects.run .fx-loop{animation:floatLoop 1900ms cubic-bezier(.18,.72,.3,1) both}.effects.run .fx-startle{animation:floatStartle 1700ms cubic-bezier(.18,.72,.3,1) both}
@keyframes floatStar{0%{opacity:0;transform:translate(390px,130px) scale(.2) rotate(-25deg)}14%{opacity:1}42%,72%{opacity:1;transform:translate(0,0) scale(1) rotate(45deg)}100%{opacity:0;transform:translate(-20px,-45px) scale(1.03) rotate(55deg)}}
@keyframes floatLoop{0%{opacity:0;transform:translate(-230px,440px) scale(.15) rotate(-25deg)}14%{opacity:1}44%,72%{opacity:1;transform:translate(0,0) scale(1) rotate(25deg)}100%{opacity:0;transform:translate(10px,-45px) scale(1.03) rotate(32deg)}}
@keyframes floatStartle{0%{opacity:0;transform:translate(-180px,330px) scale(.15)}15%{opacity:1}40%,70%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(12px,-35px) scale(1.05)}}
@media(prefers-reduced-motion:reduce){.effects.run img{animation-duration:1ms;opacity:1;transform:none}}
</style></head>
<body>
<header><div class="brand">anima <small>FY 车机交互 Demo</small></div><nav class="tools" aria-label="演示环境"><button id="gearP" aria-pressed="true">P 驻车</button><button id="gearD" aria-pressed="false">D 行车</button><button id="navToggle" aria-pressed="false">模拟导航</button><button id="guides" aria-pressed="false">可点击区域</button><button id="reset">重置</button><button id="fullscreen" class="primary">全屏体验</button></nav></header>
<main class="viewport" id="viewport"><section class="stage" id="stage" data-gear="P" aria-label="FY Launcher，2560乘1600画布">
<img id="reference" class="reference" src="assets/launcher-clean.png" alt="FY 原有 Launcher 界面，保留 Info、Control、Dock 与状态栏布局">
<div class="ambi" id="ambi" aria-hidden="true"><img src="assets/anima-background.svg" alt=""></div><img class="top-status" id="statusImage" src="assets/status-transparent.png" alt="原有顶部状态栏">
<div class="pet idle" id="pet" role="button" tabindex="0" aria-label="Anima 数字宠物，点击头部或肚子互动，长按可拖出氛围环"><img id="petImage" src="assets/pet-figma.webp" alt="原型中的白色猫咪，佩戴红色围巾"></div>
<button class="hotspot source" id="source" aria-label="蓝牙音源"></button><button class="hotspot play" id="play" aria-label="播放音乐" aria-pressed="false"></button><button class="hotspot next" id="next" aria-label="下一首"></button><button class="hotspot star" id="star" aria-label="切换氛围环"></button>
<button class="hotspot switch" id="switch" aria-label="切换到下一个氛围环"><img src="assets/ambi-button.webp" alt=""></button>
<button class="hotspot map" id="map" aria-label="开始或结束模拟导航"></button><button class="hotspot home" id="home" aria-label="返回 Anima 氛围环"></button><button class="hotspot stop-nav" id="stopNav" aria-label="结束导航"></button><div id="effects" class="effects" data-kind="none" aria-hidden="true"><img class="fx-star" src="assets/touch-star.webp" alt=""><img class="fx-loop" src="assets/touch-loop.webp" alt=""><img class="fx-startle" src="assets/startle-marks.webp" alt=""></div><div id="laser" class="laser"></div><div id="message" class="message" aria-live="polite"></div>
</section></main>
<section class="footer"><div class="statusline"><span id="stateText"><strong>驻车 · Anima 氛围环</strong>　点击猫咪头部或肚子；长按 550ms 后拖出。</span><span>2560 × 1600 · 等比显示 <span id="scaleText"></span></span></div>
<div class="actions" aria-label="演示动作"><button data-action="head">摸摸头</button><button data-action="belly">摸摸肚子</button><button data-action="play">逗一逗</button><button data-action="startle">惊吓反馈</button><button id="returnPet">回到氛围环</button><button id="themeButton">切换氛围环</button></div>
<div id="announcer" class="sr" role="status" aria-live="polite"></div></section>
<script>
'use strict';
const $=id=>document.getElementById(id),stage=$('stage'),pet=$('pet'),pic=$('petImage');
const state={gear:'P',nav:false,theme:'anima',floating:false,playing:false,pose:'hero',reactionId:0,hints:false,drag:null,hold:null,resetTimer:null};let scale=1,messageTimer;
const names={head:'摸摸头',belly:'摸摸肚子',play:'逗一逗',startle:'惊吓反馈'};
const mediaQuery=matchMedia('(prefers-reduced-motion: reduce)');
function resize(){const v=$('viewport');scale=Math.min(v.clientWidth/2560,v.clientHeight/1600);stage.style.transform=`translate(${(v.clientWidth-2560*scale)/2}px,${(v.clientHeight-1600*scale)/2}px) scale(${scale})`;$('scaleText').textContent=`${Math.round(scale*100)}%`;}new ResizeObserver(resize).observe($('viewport'));document.addEventListener('fullscreenchange',resize);
function point(e){const r=stage.getBoundingClientRect();return{x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale};}
function say(t,showOnScreen=false){$('announcer').textContent=t;if(showOnScreen){clearTimeout(messageTimer);$('message').textContent=t;$('message').classList.add('show');messageTimer=setTimeout(()=>$('message').classList.remove('show'),1800);}}
function render(){stage.dataset.gear=state.gear;stage.classList.toggle('navigating',state.nav);stage.classList.toggle('clock',state.theme==='clock');stage.classList.toggle('map-view',state.theme==='map');stage.classList.toggle('floating',state.floating);$('reference').src=state.nav?'assets/navigation.png':'assets/launcher-clean.png';$('statusImage').src=state.nav?'assets/nav-status-transparent.png':'assets/status-transparent.png';pet.classList.toggle('floating',state.floating);layoutPose();pet.setAttribute('aria-disabled',String(!canTouch()));$('gearP').setAttribute('aria-pressed',state.gear==='P');$('gearD').setAttribute('aria-pressed',state.gear==='D');$('navToggle').setAttribute('aria-pressed',state.nav);$('guides').setAttribute('aria-pressed',state.hints);$('play').classList.toggle('is-playing',state.playing);$('play').setAttribute('aria-pressed',state.playing);$('play').setAttribute('aria-label',state.playing?'暂停音乐':'播放音乐');document.querySelectorAll('[data-action]').forEach(b=>b.disabled=!canTouch());document.querySelectorAll('.hotspot,.pet').forEach(el=>el.classList.toggle('hint-glow',state.hints));pet.style.animationPlayState=state.nav&&state.theme!=='anima'?'paused':'running';const label=state.theme==='clock'?'时钟氛围环':state.theme==='map'?'导航氛围环':state.floating?'Anima 常驻展示':'Anima 氛围环';const help=state.nav?(state.theme==='anima'?'导航进行中，宠物展示继续；互动已暂停。':'已离开 Anima 环，宠物动作暂停。'):state.gear==='D'?'行车待机中，点击与拖动已停用。':'点击猫咪头部或肚子；长按 550ms 后拖出。';$('stateText').innerHTML=`<strong>${state.gear==='P'?'驻车':'行车'}${state.nav?' · 导航中':''} · ${label}</strong>　${help}`;}
function canTouch(){return state.gear==='P'&&!state.nav&&state.theme==='anima';}
function layoutPose(){
 if(state.floating){pet.style.width='420px';pet.style.height='440px';return;}
 let w=745,h=1012;
 if(state.pose==='standing'){h=1012;w=h*0.9557951482479784;}
 pet.style.width=w+'px';pet.style.height=h+'px';pet.style.left=(1979.5-w/2)+'px';pet.style.top=(1218-h)+'px';
}
function setPose(p){state.pose=p;pic.src=p==='standing'?'assets/pet-standing.webp':'assets/pet-figma.webp';layoutPose();}
function clearEffects(){const fx=$('effects');fx.classList.remove('run');fx.dataset.kind='none';}
function showEffects(kind){const fx=$('effects');fx.classList.remove('run');fx.dataset.kind=kind;void fx.offsetWidth;fx.classList.add('run');state.reactionId++;}
function act(name){if(!canTouch()||!names[name])return;clearTimeout(state.resetTimer);setPose(name==='startle'?'standing':'hero');showEffects(name==='startle'?'startle':'touch');pet.classList.remove('idle','reacting');void pet.offsetWidth;pet.classList.add('reacting');say(names[name]);state.resetTimer=setTimeout(()=>{setPose('hero');clearEffects();pet.classList.remove('reacting');pet.classList.add('idle');state.resetTimer=null;},2100);}
function cancelAction(){clearTimeout(state.resetTimer);state.resetTimer=null;clearEffects();if(state.drag){pet.releasePointerCapture?.(state.drag.id);state.drag=null}clearTimeout(state.hold);state.hold=null;pet.classList.remove('dragging','reacting');setPose('hero');pet.classList.add('idle');$('laser').style.display='none';}
function returnPet(){cancelAction();state.floating=false;state.theme='anima';pet.style.left='1607px';pet.style.top='206px';render();}
function setGear(g){cancelAction();state.gear=g;render();}
function navToggle(){cancelAction();state.nav=!state.nav;render();}
function cycleTheme(){cancelAction();state.theme=state.theme==='anima'?(state.nav?'map':'clock'):'anima';if(state.floating){state.floating=false;pet.style.left='1607px';pet.style.top='206px'}render();}
$('gearP').onclick=()=>setGear('P');$('gearD').onclick=()=>setGear('D');$('navToggle').onclick=navToggle;$('map').onclick=navToggle;$('stopNav').onclick=()=>{state.nav=false;render()};$('guides').onclick=()=>{state.hints=!state.hints;render()};$('home').onclick=returnPet;$('themeButton').onclick=cycleTheme;$('switch').onclick=cycleTheme;$('star').onclick=cycleTheme;$('returnPet').onclick=returnPet;
$('play').onclick=()=>{state.playing=!state.playing;render();say(state.playing?'模拟音乐播放':'模拟音乐暂停')};$('next').onclick=()=>{};$('source').onclick=()=>say('蓝牙音源 · 本地演示');
$('reset').onclick=()=>{cancelAction();Object.assign(state,{gear:'P',nav:false,theme:'anima',floating:false,playing:false,hints:false});pet.style.left='1607px';pet.style.top='206px';render()};
$('fullscreen').onclick=async()=>{try{if(!document.fullscreenElement)await $('viewport').requestFullscreen();else await document.exitFullscreen()}catch{say('请使用浏览器的全屏功能')}};
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action));
pet.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act('head')}});
pet.addEventListener('pointerdown',e=>{if(!canTouch()||e.button!==0)return;e.preventDefault();pet.setPointerCapture(e.pointerId);const p=point(e);state.drag={id:e.pointerId,start:p,last:p,left:parseFloat(pet.style.left||'1607'),top:parseFloat(pet.style.top||'206'),active:false,time:performance.now()};state.hold=setTimeout(()=>{if(!state.drag)return;state.drag.active=true;clearEffects();pet.classList.add('dragging');},550)});
pet.addEventListener('pointermove',e=>{const d=state.drag;if(!d||d.id!==e.pointerId)return;const p=point(e);d.last=p;if(!d.active&&Math.hypot(p.x-d.start.x,p.y-d.start.y)>24){clearTimeout(state.hold);state.hold=null;}if(!d.active)return;if(!state.floating){state.floating=true;render();d.left=p.x-210;d.top=p.y-220;d.start=p;}pet.style.left=`${Math.max(1280,Math.min(2140,d.left+p.x-d.start.x))}px`;pet.style.top=`${Math.max(100,Math.min(930,d.top+p.y-d.start.y))}px`;});
function endPointer(e,cancel=false){const d=state.drag;if(!d||d.id!==e.pointerId)return;clearTimeout(state.hold);state.hold=null;state.drag=null;pet.classList.remove('dragging');if(pet.hasPointerCapture(e.pointerId))pet.releasePointerCapture(e.pointerId);if(cancel)return;if(d.active){render();return;}if(Math.hypot(d.last.x-d.start.x,d.last.y-d.start.y)>24)return;const r=pet.getBoundingClientRect();act((e.clientY-r.top)/r.height<.4?'head':'belly');}
pet.addEventListener('pointerup',e=>endPointer(e));pet.addEventListener('pointercancel',e=>endPointer(e,true));
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.fullscreenElement)returnPet();});

window.demo={state,act,setGear,navToggle,cycleTheme,returnPet,geometry:{screen:[2560,1600],ambi:[1180,-260,1600,1600],control:'original-reference',dock:'original-reference'}};render();resize();
</script></body></html>
